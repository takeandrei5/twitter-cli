[package]
name = "collector-cli"
version = "0.1.0"
description = "A TUI that users can interact with for fast access to X"
authors = ["Andrei Tache <takeandrei5@gmail.com>"]
license = "MIT"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
color-eyre = "0.6.3"
crossterm = "0.29.0"
log = "0.4.32"
ratatui = { version = "0.30.0", features = ["unstable-rendered-line-info"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tui-input = { version = "0.15.3", features = ["crossterm"] }

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
