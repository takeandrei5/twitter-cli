<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Twitter TUI · Login successful</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #21262d;
      --blue: #1d9bf0;
      --green: #00ba7c;
      --text: #e6edf3;
      --dim: #8b949e;
    }

    * { box-sizing: border-box; }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      place-items: center;
      color: var(--text);
      background: var(--bg);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .terminal {
      width: min(100%, 520px);
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .35);
    }

    .bar {
      padding: 11px 16px;
      border-bottom: 1px solid var(--border);
      color: var(--dim);
      font-size: 12px;
    }

    .dots { margin-right: 10px; color: var(--green); letter-spacing: .18em; }
    .content { padding: 34px 28px 38px; font-size: 14px; line-height: 2; }
    .prompt { color: var(--blue); }
    .success { color: var(--green); }
    .muted { color: var(--dim); }
    .cursor { display: inline-block; width: 8px; height: 16px; margin-left: 4px; vertical-align: -2px; background: var(--green); animation: blink 1s steps(2, jump-none) infinite; }

    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body>
  <main class="terminal" role="status" aria-live="polite">
    <header class="bar"><span class="dots">● ● ●</span> oauth_callback</header>
    <section class="content">
      <div><span class="prompt">$</span> twitter-tui auth</div>
      <div class="success">✓ Login successful.</div>
      <div class="success">✓ Session ready.</div>
      <div class="muted"><span class="prompt">$</span> You may close this window<span class="cursor"></span></div>
    </section>
  </main>
</body>
</html>
