[package]
name = "twitter-newsfeeder"
version = "0.1.0"
description = "A TUI that users can interact with for fast access to X"
authors = ["Andrei Tache <takeandrei5@gmail.com>"]
license = "MIT"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
chrono = { version = "0.4.45", features = ["serde"] }
color-eyre = "0.6.3"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dotenvy = "0.15.7"
log = "0.4.32"
oauth2 = { version = "5.0.0", features = ["reqwest-blocking"] }
ratatui = { version = "0.30.0", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.13.4", features = ["json", "query"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serial_test = "4.0.1"
thiserror = "2.0.18"
tiny_http = "0.12.0"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tui-input = { version = "0.15.3", features = ["crossterm"] }
url = "2.5.8"
webbrowser = "1.2.2"
yield-return = "0.2.0"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dev-dependencies]
httpmock = "0.8.3"
insta = "1.48.0"
rstest = "0.26.1"
serial_test = "4.0.1"
wiremock = "0.6.5"
